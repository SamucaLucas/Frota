workflows:
  ios-capacitor:
    name: Build iOS (Capacitor)
    working_directory: my-app
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependências Web (Node)
        script: |
          npm install --legacy-peer-deps

      - name: Sincronizar o Capacitor com a pasta iOS
        script: |
          npx cap sync ios

      - name: Compilar App iOS sem Assinatura (Unsigned)
        script: |
          cd ios/App
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Gerar o arquivo .ipa para o AltStore/Sideloadly
        script: |
          # Procura onde o Xcode jogou o arquivo .app compilado
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "App.app" -path "*/Build/Products/Release-iphoneos/*" | head -n 1)
          
          # Cria a estrutura de pastas exigida para um arquivo .ipa
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          
          # Compacta tudo no formato .ipa pronto para você baixar
          cd build
          zip -r Sousa-LT.ipa Payload

    artifacts:
      - build/Sousa-LT.ipa

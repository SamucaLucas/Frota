workflows:
  ios-capacitor:
    name: Build iOS (Capacitor)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependências do Node
        script: |
          npm install

      - name: Sincronizar o Capacitor com a pasta iOS
        script: |
          npx cap sync ios

      - name: Instalar Pods nativos do iOS (CocoaPods)
        script: |
          cd ios/App
          pod install

      - name: Compilar App iOS (Unsigned para Testes)
        script: |
          xcodebuild build \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Gerar pacote Arquivo (.xcarchive)
        script: |
          cd ios/App
          mkdir -p build/Unsigned
          xcrun xcodebuild -a -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos archive -archivePath build/App.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

    artifacts:
      - ios/App/build/**/*.xcarchive
      - ios/App/build/**/*.app
      - build/ios/ipa/*.ipa

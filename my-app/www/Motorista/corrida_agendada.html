<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viagem em Andamento</title>
    <link rel="icon" href="../static/img/Logo-icon.png" type="image/png">
    <link rel="stylesheet" href="../static/style.css">
    <style>
        /* === ESTILOS IMERSIVOS (TIPO TAXÍMETRO) === */
        body {
            background: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            font-family: 'Sora', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header-top {
            display: flex;
            align-items: center;
            padding: 20px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-voltar {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 24px;
            cursor: pointer;
            margin-right: 15px;
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge.loading {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        .main-content {
            flex: 1;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card-info {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #334155;
        }

        .label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .value {
            font-size: 16px;
            color: #f8fafc;
            font-weight: 600;
            margin-bottom: 16px;
            word-wrap: break-word;
        }

        .value:last-child {
            margin-bottom: 0;
        }

        .price-display {
            font-size: 32px;
            font-weight: 800;
            color: #10b981;
            text-align: center;
            margin: 10px 0;
        }

        .btn-map {
            background: #334155;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
            width: 100%;
        }

        .btn-map:active {
            background: #475569;
            transform: scale(0.98);
        }

        .btn-map.blue {
            background: rgba(37, 99, 235, 0.1);
            color: #60a5fa;
            border-color: rgba(37, 99, 235, 0.3);
        }

        .btn-map.blue:active {
            background: rgba(37, 99, 235, 0.2);
        }

        .btn-finalizar {
            background: #e30613;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(227, 6, 19, 0.3);
            transition: 0.2s;
            margin-top: 0;
        }

        .btn-finalizar:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        /* === ESTILOS BOTÃO DE ARRASTAR (SWIPE TO CONFIRM) === */
        .swipe-container {
            position: relative;
            width: 100%;
            height: 56px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            touch-action: none;
            /* Previne scroll acidental na tela ao arrastar */
        }

        .swipe-bg {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0;
            background: #3b82f6;
            z-index: 1;
        }

        .swipe-text {
            position: absolute;
            width: 100%;
            text-align: center;
            color: #94a3b8;
            font-weight: 700;
            font-size: 14px;
            z-index: 2;
            pointer-events: none;
        }

        .swipe-knob {
            position: absolute;
            left: 4px;
            width: 48px;
            height: 48px;
            background: #f8fafc;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            z-index: 3;
            cursor: grab;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            color: #000;
        }

        .swipe-knob:active {
            cursor: grabbing;
        }

        /* MODAL FINALIZAÇÃO */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }

        .modal-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 24px;
            width: 100%;
            max-width: 360px;
            padding: 24px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 800;
            color: #f8fafc;
            margin-bottom: 16px;
            text-align: center;
        }

        .input-dark {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            color: #10b981;
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .input-dark:focus {
            outline: none;
            border-color: #10b981;
        }

        .btn-confirm {
            background: #10b981;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .btn-cancel {
            background: transparent;
            color: #94a3b8;
            border: none;
            padding: 16px;
            font-size: 14px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="header-top">
        <button class="btn-voltar" onclick="voltarParaHome()">←</button>
        <div id="status-badge" class="status-badge loading">
            ⏳ Carregando Rota...
        </div>
    </div>

    <div class="main-content">

        <!-- Info do Passageiro e Valores -->
        <div class="card-info">
            <div class="label">Passageiro</div>
            <div class="value" id="txt-passageiro">...</div>

            <!-- NOVA ABA: DATA E HORA AGENDADA -->
            <div class="label" style="margin-top: 20px;">Data e Hora Agendada</div>
            <div class="value" id="txt-data">...</div>

            <div class="label" style="margin-top: 20px;">Valor Estimado</div>
            <div class="price-display" id="txt-valor">R$ 0,00</div>
        </div>

        <!-- Endereços -->
        <div class="card-info">
            <div class="label">Origem</div>
            <div class="value" id="txt-origem">...</div>

            <div class="label" style="margin-top: 20px;">Destino</div>
            <div class="value" id="txt-destino">...</div>
        </div>

        <!-- ETAPA 1: Deslocamento até o cliente -->
        <div id="etapa-1" style="display: none; flex-direction: column; gap: 12px; margin-top: auto;">
            <button class="btn-map" id="btn-gps-origem" onclick="">
                <span style="font-size: 20px;">📍</span> Navegar até o Cliente
            </button>

            <!-- Substituído pelo Botão de Arrastar -->
            <div class="swipe-container" id="swipe-chegada">
                <div class="swipe-bg" id="swipe-bg"></div>
                <div class="swipe-text" id="swipe-text">Deslize p/ confirmar chegada ➔</div>
                <div class="swipe-knob" id="swipe-knob">🚕</div>
            </div>
        </div>

        <!-- ETAPA 2: Corrida em andamento (Inicialmente Oculta) -->
        <div id="etapa-2" style="display: none; flex-direction: column; gap: 12px; margin-top: auto;">
            <button class="btn-map blue" id="btn-gps-destino" onclick="">
                <span style="font-size: 20px;">🏁</span> Navegar até o Destino
            </button>
            <button class="btn-finalizar" onclick="abrirModalFinalizar()">
                ✓ Finalizar Corrida
            </button>
        </div>

    </div>

    <!-- MODAL DE FECHAMENTO FINANCEIRO -->
    <div class="modal-overlay" id="modal-fechamento">
        <div class="modal-box">
            <div class="modal-title">Confirmar Recebimento</div>
            <div style="text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 16px;">
                Edite o valor abaixo se houve alguma alteração na rota ou taxas extras.
            </div>

            <input type="number" id="input-valor-final" class="input-dark" step="0.01" min="0">

            <button class="btn-confirm" id="btn-confirmar" onclick="salvarFechamento()">Confirmar e Gerar
                Recibo</button>
            <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
        </div>
    </div>

    <script src="../static/app.js"></script>
    <script src="../static/gps_tracker.js"></script>
    <script>
        const token = sessionStorage.getItem("token") || localStorage.getItem("token");
        if (!token) window.location.href = "../Usuario/login.html";

        const urlParams = new URLSearchParams(window.location.search);
        const corridaID = urlParams.get('id');

        if (!corridaID) window.history.back();

        let valorEstimadoOriginal = 0;

        window.onload = async function () {
            try {
                // Inicia Botão Swipe
                initSwipeButton('swipe-chegada', 'swipe-knob', 'swipe-bg', 'swipe-text', marcarChegada);

                // Busca os dados da corrida
                const response = await fetch(`${window.API_URL}/api/corrida/detalhes?id=${corridaID}`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                const dados = await response.json();

                if (response.ok) {
                    // ========================================================
                    // GATILHO AUTOMÁTICO TURBINADO: Aprovada -> A Caminho
                    // ========================================================
                    let statusAtual = dados.Status || dados.status || "";
                    let statusLimpo = statusAtual.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();

                    // Se o status for qualquer variação de aprovada, confirmada ou pendente
                    if (statusLimpo === "aprovada" || statusLimpo === "confirmada" || statusLimpo === "pendente") {
                        try {
                            await fetch(`${window.API_URL}/api/motorista/atualizar-status`, {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json",
                                    "Authorization": `Bearer ${token}`
                                },
                                body: JSON.stringify({
                                    corrida_id: parseInt(corridaID),
                                    status: "A Caminho"
                                })
                            });
                            // Atualiza a variável local para exibir a etapa certa
                            dados.Status = "A Caminho";
                        } catch (e) {
                            console.log("Erro no gatilho A Caminho:", e);
                        }
                    }
                    // ========================================================

                    // Limpeza de textos
                    let origemLimpa = dados.OrigemTexto || "Embarque Livre";
                    let nomePassageiro = dados.Usuario && dados.Usuario.Nome ? dados.Usuario.Nome : "Cliente Avulso";

                    if (origemLimpa.includes("(Cliente:")) {
                        const partes = origemLimpa.split("(Cliente:");
                        origemLimpa = partes[0].trim();
                        nomePassageiro = partes[1].replace(")", "").trim();
                    }

                    document.getElementById('txt-passageiro').innerText = nomePassageiro;
                    document.getElementById('txt-origem').innerText = origemLimpa;
                    document.getElementById('txt-destino').innerText = dados.DestinoTexto || "Desembarque Livre";

                    const dataFmt = new Date(dados.DataHoraAgendada || dados.created_at).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
                    document.getElementById('txt-data').innerText = dataFmt;

                    valorEstimadoOriginal = parseFloat(dados.ValorEstimado || dados.ValorFinal || 0);
                    document.getElementById('txt-valor').innerText = "R$ " + valorEstimadoOriginal.toFixed(2).replace('.', ',');

                    const linkOrigem = `https://maps.google.com/?q=${dados.OrigemLat},${dados.OrigemLng}`;
                    const linkDestino = `https://maps.google.com/?q=${dados.DestinoLat},${dados.DestinoLng}`;

                    document.getElementById('btn-gps-origem').setAttribute("onclick", `window.open('${linkOrigem}', '_blank')`);
                    document.getElementById('btn-gps-destino').setAttribute("onclick", `window.open('${linkDestino}', '_blank')`);

                    // LÓGICA DE EXIBIÇÃO EM DUAS TELAS BASEADA NO STATUS
                    if (dados.Status === "Em Corrida" || dados.status === "Em Corrida") {
                        document.getElementById('etapa-1').style.display = 'none';
                        document.getElementById('etapa-2').style.display = 'flex';
                        document.getElementById('status-badge').innerHTML = "🟢 Em Corrida";
                        document.getElementById('status-badge').className = "status-badge";

                        if (window.GPSGlobal) {
                            window.GPSGlobal.mudarStatus("Em Corrida Agendada", parseInt(corridaID));
                        }
                    } else {
                        document.getElementById('etapa-1').style.display = 'flex';
                        document.getElementById('etapa-2').style.display = 'none';
                        document.getElementById('status-badge').innerHTML = "🟡 A Caminho";
                        document.getElementById('status-badge').className = "status-badge loading";

                        if (window.GPSGlobal) {
                            window.GPSGlobal.mudarStatus("A Caminho do Cliente", parseInt(corridaID));
                        }
                    }

                } else {
                    alert("Erro ao buscar detalhes da corrida.");
                    voltarParaHome();
                }
            } catch (err) {
                console.error(err);
                alert("Falha de conexão.");
            }
        };

        // ==========================================
        // LÓGICA DO BOTÃO SWIPE TO CONFIRM
        // ==========================================
        function initSwipeButton(containerId, knobId, bgId, textId, onConfirm) {
            const container = document.getElementById(containerId);
            const knob = document.getElementById(knobId);
            const bg = document.getElementById(bgId);
            const text = document.getElementById(textId);

            if (!container || !knob) return;

            let isDragging = false;
            let startX = 0;
            let maxDrag = 0;
            let currentX = 0;

            const startDrag = (e) => {
                isDragging = true;
                startX = e.type.includes('mouse') ? e.pageX : e.touches[0].clientX;

                const match = knob.style.transform.match(/translateX\((.*)px\)/);
                currentX = match ? parseFloat(match[1]) : 0;

                knob.style.transition = 'none';
                bg.style.transition = 'none';
            };

            const onDrag = (e) => {
                if (!isDragging) return;
                let eventX = e.type.includes('mouse') ? e.pageX : e.touches[0].clientX;
                let moveX = currentX + (eventX - startX);

                maxDrag = container.clientWidth - knob.clientWidth - 8;

                if (moveX < 0) moveX = 0;
                if (moveX > maxDrag) moveX = maxDrag;

                knob.style.transform = `translateX(${moveX}px)`;
                bg.style.width = `${moveX + knob.clientWidth / 2}px`;
                text.style.opacity = 1 - (moveX / maxDrag);
            };

            const endDrag = (e) => {
                if (!isDragging) return;
                isDragging = false;

                knob.style.transition = 'transform 0.3s ease';
                bg.style.transition = 'width 0.3s ease';
                text.style.transition = 'opacity 0.3s ease';

                const match = knob.style.transform.match(/translateX\((.*)px\)/);
                const finalX = match ? parseFloat(match[1]) : 0;

                if (finalX >= maxDrag * 0.85) {
                    knob.style.transform = `translateX(${maxDrag}px)`;
                    bg.style.width = '100%';
                    text.innerText = "Confirmado!";
                    text.style.opacity = 1;
                    text.style.color = "#fff";
                    text.style.zIndex = 4;

                    knob.removeEventListener('mousedown', startDrag);
                    knob.removeEventListener('touchstart', startDrag);

                    setTimeout(() => {
                        onConfirm();
                    }, 400);
                } else {
                    knob.style.transform = `translateX(0px)`;
                    bg.style.width = '0px';
                    text.style.opacity = 1;
                }
            };

            knob.addEventListener('mousedown', startDrag);
            knob.addEventListener('touchstart', startDrag, { passive: true });
            document.addEventListener('mousemove', onDrag);
            document.addEventListener('touchmove', onDrag, { passive: true });
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchend', endDrag);
        }

        // ==========================================
        // FLUXO DE BOTÕES DA CORRIDA
        // ==========================================
        function marcarChegada() {
            document.getElementById('etapa-1').style.display = 'none';
            document.getElementById('etapa-2').style.display = 'flex';

            const badge = document.getElementById('status-badge');
            badge.innerHTML = "🟢 Em Corrida";
            badge.className = "status-badge";

            if (window.GPSGlobal) {
                window.GPSGlobal.mudarStatus("Em Corrida Agendada", parseInt(corridaID));
            }

            fetch(`${window.API_URL}/api/motorista/atualizar-status`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({
                    corrida_id: parseInt(corridaID),
                    status: "Em Corrida"
                })
            }).catch(err => console.error("Erro ao atualizar status da corrida:", err));
        }

        function abrirModalFinalizar() {
            document.getElementById('input-valor-final').value = valorEstimadoOriginal.toFixed(2);
            document.getElementById('modal-fechamento').style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('modal-fechamento').style.display = 'none';
        }

        function voltarParaHome() {
            if (window.GPSGlobal) {
                window.GPSGlobal.mudarStatus("Disponível", 0);
            }
            window.history.back();
        }

        function salvarFechamento() {
            const btnConfirmar = document.getElementById('btn-confirmar');
            const valorFinalCobrado = parseFloat(document.getElementById('input-valor-final').value);

            if (isNaN(valorFinalCobrado) || valorFinalCobrado <= 0) {
                alert("Por favor, insira um valor válido.");
                return;
            }

            btnConfirmar.innerText = "Salvando...";
            btnConfirmar.disabled = true;

            fetch(`${window.API_URL}/api/motorista/concluir`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({
                    corrida_id: parseInt(corridaID),
                    valor_final: valorFinalCobrado
                })
            })
                .then(res => res.json())
                .then(dados => {
                    if (dados.sucesso) {
                        if (window.GPSGlobal) window.GPSGlobal.mudarStatus("Disponível", 0);
                        alert("Corrida Finalizada com Sucesso!");
                        window.location.href = `../Dados/recibo.html?id=${corridaID}`;
                    } else {
                        alert("Erro ao finalizar: " + dados.erro);
                        btnConfirmar.innerText = "Confirmar e Gerar Recibo";
                        btnConfirmar.disabled = false;
                    }
                })
                .catch(err => {
                    alert("Erro de conexão ao salvar fechamento.");
                    btnConfirmar.innerText = "Confirmar e Gerar Recibo";
                    btnConfirmar.disabled = false;
                });
        }
    </script>
</body>

</html>

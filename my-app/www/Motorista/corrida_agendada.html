<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Viagem em Andamento</title>
    <link rel="icon" href="../static/img/Logo-icon.png" type="image/png">
    <link rel="stylesheet" href="../static/style.css">
    <style>
        /* === ESTILOS IMERSIVOS (TIPO TAXÍMETRO) === */
        body {
            background: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            font-family: 'Sora', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header-top {
            display: flex;
            align-items: center;
            padding: 20px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-voltar {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 24px;
            cursor: pointer;
            margin-right: 15px;
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge.loading {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        .main-content {
            flex: 1;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card-info {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #334155;
        }

        .label {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .value {
            font-size: 16px;
            color: #f8fafc;
            font-weight: 600;
            margin-bottom: 16px;
            word-wrap: break-word;
        }

        .value:last-child {
            margin-bottom: 0;
        }

        .price-display {
            font-size: 32px;
            font-weight: 800;
            color: #10b981;
            text-align: center;
            margin: 10px 0;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-map {
            background: #334155;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 16px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn-map:active {
            background: #475569;
            transform: scale(0.98);
        }

        .btn-map.blue {
            background: rgba(37, 99, 235, 0.1);
            color: #60a5fa;
            border-color: rgba(37, 99, 235, 0.3);
        }

        .btn-map.blue:active {
            background: rgba(37, 99, 235, 0.2);
        }

        .btn-finalizar {
            background: #e30613;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(227, 6, 19, 0.3);
            transition: 0.2s;
            margin-top: auto;
        }

        .btn-finalizar:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        /* MODAL FINALIZAÇÃO */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
        }

        .modal-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 24px;
            width: 100%;
            max-width: 360px;
            padding: 24px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 800;
            color: #f8fafc;
            margin-bottom: 16px;
            text-align: center;
        }

        .input-dark {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            color: #10b981;
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .input-dark:focus {
            outline: none;
            border-color: #10b981;
        }

        .btn-confirm {
            background: #10b981;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .btn-cancel {
            background: transparent;
            color: #94a3b8;
            border: none;
            padding: 16px;
            font-size: 14px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="header-top">
        <button class="btn-voltar" onclick="voltarParaHome()">←</button>
        <div id="status-badge" class="status-badge loading">
            ⏳ Carregando Rota...
        </div>
    </div>

    <div class="main-content">

        <!-- Info do Passageiro e Valores -->
        <div class="card-info">
            <div class="label">Passageiro</div>
            <div class="value" id="txt-passageiro">...</div>

            <div class="label" style="margin-top: 20px;">Valor Estimado</div>
            <div class="price-display" id="txt-valor">R$ 0,00</div>
        </div>

        <!-- Endereços -->
        <div class="card-info">
            <div class="label">Origem</div>
            <div class="value" id="txt-origem">...</div>

            <div class="label" style="margin-top: 20px;">Destino</div>
            <div class="value" id="txt-destino">...</div>
        </div>

        <!-- Botões de Ação do Mapa -->
        <div class="actions-grid">
            <button class="btn-map" id="btn-gps-origem" onclick="">
                <span style="font-size: 24px;">📍</span>
                Buscar Cliente
            </button>
            <button class="btn-map blue" id="btn-gps-destino" onclick="">
                <span style="font-size: 24px;">🏁</span>
                Ir p/ Destino
            </button>
        </div>

        <button class="btn-finalizar" onclick="abrirModalFinalizar()">Finalizar Corrida</button>

    </div>

    <!-- MODAL DE FECHAMENTO FINANCEIRO -->
    <div class="modal-overlay" id="modal-fechamento">
        <div class="modal-box">
            <div class="modal-title">Confirmar Recebimento</div>
            <div style="text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 16px;">
                Edite o valor abaixo se houve alguma alteração na rota ou taxas extras.
            </div>

            <input type="number" id="input-valor-final" class="input-dark" step="0.01" min="0">

            <button class="btn-confirm" id="btn-confirmar" onclick="salvarFechamento()">Confirmar e Gerar
                Recibo</button>
            <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
        </div>
    </div>

    <script src="../static/app.js"></script>
    <script src="../static/gps_tracker.js"></script>
    <script>
        const token = sessionStorage.getItem("token") || localStorage.getItem("token");
        if (!token) window.location.href = "../Usuario/login.html";

        const urlParams = new URLSearchParams(window.location.search);
        const corridaID = urlParams.get('id');

        // Impede de abrir a tela sem um ID de corrida
        if (!corridaID) window.history.back();

        let valorEstimadoOriginal = 0;

        window.onload = async function () {
            try {
                // 1. Informa ao servidor GPS que a corrida começou!
                if (window.GPSGlobal) {
                    window.GPSGlobal.mudarStatus("Em Corrida Agendada");
                }

                // 2. Busca os dados da corrida
                const response = await fetch(`${window.API_URL}/api/corrida/detalhes?id=${corridaID}`);
                const dados = await response.json();

                if (response.ok) {
                    // Preenche a tela
                    document.getElementById('txt-passageiro').innerText = dados.Usuario ? dados.Usuario.Nome : "Cliente";
                    document.getElementById('txt-origem').innerText = dados.OrigemTexto;
                    document.getElementById('txt-destino').innerText = dados.DestinoTexto;

                    valorEstimadoOriginal = parseFloat(dados.ValorEstimado || dados.ValorFinal || 0);
                    document.getElementById('txt-valor').innerText = "R$ " + valorEstimadoOriginal.toFixed(2).replace('.', ',');

                    // Configura os links do Maps
                    const linkOrigem = `https://maps.google.com/?q=${dados.OrigemLat},${dados.OrigemLng}`;
                    const linkDestino = `https://maps.google.com/?q=${dados.DestinoLat},${dados.DestinoLng}`;

                    document.getElementById('btn-gps-origem').setAttribute("onclick", `window.open('${linkOrigem}', '_blank')`);
                    document.getElementById('btn-gps-destino').setAttribute("onclick", `window.open('${linkDestino}', '_blank')`);

                    // Atualiza Badge Visual
                    const badge = document.getElementById('status-badge');
                    badge.className = "status-badge";
                    badge.innerHTML = "🟢 Em Corrida";

                } else {
                    alert("Erro ao buscar detalhes da corrida.");
                    voltarParaHome();
                }
            } catch (err) {
                console.error(err);
                alert("Falha de conexão.");
            }
        };

        function abrirModalFinalizar() {
            // Injeta o valor estimado como sugestão no input para facilitar a vida do motorista
            document.getElementById('input-valor-final').value = valorEstimadoOriginal.toFixed(2);
            document.getElementById('modal-fechamento').style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('modal-fechamento').style.display = 'none';
        }

        function voltarParaHome() {
            // Se ele voltar pra home sem finalizar, o status do GPS volta para Disponível
            if (window.GPSGlobal) {
                window.GPSGlobal.mudarStatus("Disponível");
            }
            window.history.back();
        }

        function salvarFechamento() {
            const btnConfirmar = document.getElementById('btn-confirmar');
            const valorFinalCobrado = parseFloat(document.getElementById('input-valor-final').value);

            if (isNaN(valorFinalCobrado) || valorFinalCobrado <= 0) {
                alert("Por favor, insira um valor válido.");
                return;
            }

            btnConfirmar.innerText = "Salvando...";
            btnConfirmar.disabled = true;

            // Envia para o Backend que a corrida foi concluída, e informa o valor REAL que o motorista recebeu
            fetch(`${window.API_URL}/api/motorista/concluir`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({
                    corrida_id: parseInt(corridaID),
                    valor_final: valorFinalCobrado
                })
            })
                .then(res => res.json())
                .then(dados => {
                    if (dados.sucesso) {
                        // Libera o motorista no Radar/GPS
                        if (window.GPSGlobal) window.GPSGlobal.mudarStatus("Disponível");

                        alert("Corrida Finalizada com Sucesso!");

                        // Joga o motorista direto pro recibo pra ele poder compartilhar!
                        window.location.href = `../Dados/recibo.html?id=${corridaID}`;
                    } else {
                        alert("Erro ao finalizar: " + dados.erro);
                        btnConfirmar.innerText = "Confirmar e Gerar Recibo";
                        btnConfirmar.disabled = false;
                    }
                })
                .catch(err => {
                    alert("Erro de conexão ao salvar fechamento.");
                    btnConfirmar.innerText = "Confirmar e Gerar Recibo";
                    btnConfirmar.disabled = false;
                });
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Carregando...</title>

    <link rel="manifest" href="manifest.json">

    <script src="static/app.js"></script>
</head>

<body
    style="background: var(--bg, #0f172a); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">

    <div style="text-align: center; color: #fff; font-family: sans-serif;">
        <div style="font-size: 32px; margin-bottom: 8px;">🚕</div>
        <div style="font-size: 14px; font-weight: bold; color: #94a3b8;">Acessando sistema...</div>
    </div>

    <script>
        const token = localStorage.getItem("token") || sessionStorage.getItem("token");

        if (!token) {
            // Se não tem token salvo, manda direto para o Login
            window.location.replace("Usuario/login.html");
        } else {
            // Agora o window.API_URL existe graças ao import no <head>!
            fetch(`${window.API_URL}/api/verificar-token`, {
                method: "GET",
                headers: {
                    "Authorization": `Bearer ${token}`
                }
            })
                .then(res => res.json())
                .then(dados => {
                    // Aceita tanto valido quanto sucesso dependendo de como sua API responde
                    if (dados.valido || dados.sucesso) {
                        // Redireciona localmente conforme o papel
                        if (dados.papel === "admin") {
                            window.location.replace("Admin/home_admin.html");
                        } else if (dados.papel === "motorista") {
                            window.location.replace("Motorista/home_motorista.html");
                        } else {
                            window.location.replace("Passageiro/home_Passageiro.html");
                        }
                    } else {
                        // Token expirado/inválido: limpa o storage e manda pro login
                        localStorage.removeItem("token");
                        sessionStorage.removeItem("token");
                        window.location.replace("Usuario/login.html");
                    }
                })
                .catch((error) => {
                    console.log("Erro de conexão na verificação:", error);
                    // ATENÇÃO: Se der erro de internet (offline), NÃO deletamos o token!
                    // Apenas mandamos pro login por segurança, mas ele continua salvo.
                    window.location.replace("Usuario/login.html");
                });
        }

        // Registra o PWA apenas se estiver no Navegador (Web) usando HTTPS
        if ('serviceWorker' in navigator && (!window.Capacitor || !window.Capacitor.isNativePlatform())) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('[PWA] Service Worker Registrado com Sucesso!'))
                .catch(err => console.log('[PWA] Falha ao registrar Service Worker:', err));
        }
    </script>
</body>

</html>

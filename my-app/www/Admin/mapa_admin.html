{{define "AdminMapa"}}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa da Frota - Admin</title>
    <link rel="stylesheet" href="../static/style.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* --- SCROLL NATIVO LIVRE --- */
        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .home-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            padding-bottom: 30px;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .back-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--t1);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        /* Container do mapa ocupa a altura restante do celular de forma dinâmica */
        #mapa-frota-central {
            flex: 1;
            min-height: calc(100vh - 160px);
            border-radius: 16px;
            border: 1px solid var(--border);
            z-index: 1;
            /* Mantém abaixo da sidebar */
        }

        /* --- ESTILOS DO MENU LATERAL (SIDEBAR) --- */
        .menu-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--t1);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-left: auto;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 260px;
            height: 100%;
            background: var(--bg);
            z-index: 1000;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar.open {
            left: 0;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .sb-header {
            padding: 30px 20px 20px;
            font-size: 18px;
            font-weight: 800;
            color: var(--t1);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sb-close {
            background: none;
            border: none;
            color: var(--t3);
            font-size: 24px;
            cursor: pointer;
        }

        .sb-link {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--t2);
            font-size: 14px;
            font-weight: 600;
            font-family: 'Sora', sans-serif;
            text-decoration: none;
            border: none;
            border-bottom: 1px solid var(--border);
            background: transparent;
            border-left: 3px solid transparent;
            cursor: pointer;
            width: 100%;
            text-align: left;
        }

        .sb-link svg {
            width: 22px;
            height: 22px;
            opacity: 0.7;
        }

        .sb-link.active {
            color: var(--acc);
            border-left-color: var(--acc);
            background: var(--acc-bg);
        }

        .sb-link.active svg {
            opacity: 1;
        }

        .sb-theme-btn {
            margin: 20px;
            padding: 12px;
            border-radius: 12px;
            background: var(--bg3);
            border: 1px solid var(--border);
            color: var(--t1);
            font-weight: 700;
            font-family: 'Sora', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .sb-theme-btn:active {
            background: var(--border);
        }
    </style>
</head>

<body>
    <script>
        if (localStorage.getItem('theme') === 'light' || document.documentElement.classList.contains('light-mode')) {
            document.body.classList.add('light-mode');
            document.documentElement.classList.add('light-mode');
        }
    </script>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sb-header">
            Painel Admin
            <button class="sb-close" onclick="toggleMenu()">×</button>
        </div>

        <button id="theme-toggle" class="sb-theme-btn">
            ☀️ Alternar Tema
        </button>

        <button class="sb-link" onclick="window.location.href='/admin/home'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
                <polyline points="14 2 14 8 20 8" />
                <line x1="16" y1="13" x2="8" y2="13" />
                <line x1="16" y1="17" x2="8" y2="17" />
                <polyline points="10 9 9 9 8 9" />
            </svg>
            Despacho
        </button>
        <button class="sb-link active" onclick="window.location.href='/admin/mapa'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round">
                <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21" />
                <line x1="9" y1="3" x2="9" y2="18" />
                <line x1="15" y1="6" x2="15" y2="21" />
            </svg>
            Mapa da Frota
        </button>
        <button class="sb-link" onclick="window.location.href='/admin/sorteio'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
            </svg>
            Sorteio
        </button>
        <button class="sb-link" onclick="window.location.href='/admin/motoristas'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M23 21v-2a4 4 0 00-3-3.87" />
                <path d="M16 3.13a4 4 0 010 7.75" />
            </svg>
            Motoristas
        </button>
        <button class="sb-link" onclick="window.location.href='/admin/config'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round">
                <circle cx="12" cy="12" r="3" />
                <path
                    d="M19.07 4.93l-1.41 1.41M16.95 16.95l1.41 1.41M4.93 4.93l1.41 1.41M7.05 16.95l-1.41 1.41M21 12h-2M5 12H3M12 3V1M12 23v-2" />
            </svg>
            Configurações
        </button>
        <button class="sb-link" onclick="window.location.href='/logout'"
            style="margin-top: auto; color: #EF4444; border-bottom: none; border-top: 1px solid var(--border);">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Sair da Conta
        </button>
    </div>

    <div class="app-container">
        <div class="home-content">

            <div class="header-top">
                <button class="back-btn" onclick="window.location.href='/admin/home'">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 12H5M12 19l-7-7 7-7" />
                    </svg>
                </button>
                <div style="font-size: 18px; font-weight: 800; color: var(--t1);">Mapa da Frota</div>

                <button class="menu-btn" onclick="toggleMenu()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round" width="22" height="22">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div id="mapa-frota-central"></div>

        </div>
    </div>

    <script src="../static/app.js"></script>
    <script>
        // Pega o token da URL (se veio do login do Google Web)
        const urlParams = new URLSearchParams(window.location.search);
        const tokenURL = urlParams.get('token');

        if (tokenURL) {
            // Salva o token no navegador
            localStorage.setItem("token", tokenURL);
            // Limpa o ?token= da barra de endereço para ficar bonito
            window.history.replaceState({}, document.title, window.location.pathname);
        }
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open');
        }

        // Inicialização do Leaflet em Parauapebas-PA [-6.0673, -49.9036]
        var map = L.map('mapa-frota-central').setView([-6.0673, -49.9036], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Ícone customizado de carrinho para marcar os motoristas no mapa
        var iconeCarro = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3204/3204121.png',
            iconSize: [32, 32],
            iconAnchor: [16, 32],
            popupAnchor: [0, -32]
        });

        // Simulação de motorista ativo no mapa
        L.marker([-6.0673, -49.9036], { icon: iconeCarro }).addTo(map)
            .bindPopup('<div style="font-family:Sora; font-size:12px;"><b>🚙 Motorista Dudu</b><br><span style="color:#2ecc71;">Disponível</span></div>');
    </script>
</body>

</html>
{{end}}

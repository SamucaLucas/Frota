<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mapa da Frota - Admin</title>
    <link rel="icon" href="../static/img/Logo-icon.png" type="image/png">
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../static/style.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* --- SCROLL NATIVO LIVRE --- */
        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            background: var(--bg);
            font-family: 'Sora', sans-serif;
        }

        .app-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px 20px 10px 20px;
            background: var(--bg);
            z-index: 50;
        }

        .back-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--t1);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .menu-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--t1);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-left: auto;
        }

        /* --- MAPA E LISTA --- */
        .map-wrapper {
            width: 100%;
            height: 45vh;
            border-bottom: 2px solid var(--border);
            position: relative;
            z-index: 1;
        }

        #mapa-frota-central {
            width: 100%;
            height: 100%;
        }

        .frota-list-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: var(--bg);
        }

        .sec-lbl {
            font-size: 14px;
            font-weight: 800;
            color: var(--t1);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .driver-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            margin-bottom: 12px;
            background: var(--card);
            border-radius: 14px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
            transition: all 0.2s;
        }

        .btn-focar {
            background: var(--bg2);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 800;
            color: var(--t1);
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-focar:active {
            transform: scale(0.95);
            background: var(--border);
        }

        /* --- ÍCONES PERSONALIZADOS DO MAPA (PLACAS) --- */
        .frota-icon-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .car-label {
            background: rgba(10, 10, 12, 0.9);
            color: white;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 8px;
            white-space: nowrap;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: -4px;
            z-index: 10;
        }

        .light-mode .car-label {
            background: rgba(255, 255, 255, 0.95);
            color: #000;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .car-emoji {
            font-size: 26px;
            line-height: 1;
            transition: all 0.3s;
        }

        /* Cores baseadas no Status */
        .status-verde .car-emoji {
            filter: drop-shadow(0px 0px 8px #2ecc71);
        }

        .status-laranja .car-emoji {
            filter: drop-shadow(0px 0px 8px #f39c12);
        }

        .status-cinza .car-emoji {
            filter: grayscale(100%) opacity(0.6);
        }

        /* --- SIDEBAR --- */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 260px;
            height: 100%;
            background: var(--bg);
            z-index: 1000;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar.open {
            left: 0;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .sb-header {
            padding: 30px 20px 20px;
            font-size: 18px;
            font-weight: 800;
            color: var(--t1);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sb-close {
            background: none;
            border: none;
            color: var(--t3);
            font-size: 24px;
            cursor: pointer;
        }

        .sb-link {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--t2);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            border-bottom: 1px solid var(--border);
            background: transparent;
            border-left: 3px solid transparent;
            cursor: pointer;
            width: 100%;
            text-align: left;
        }

        .sb-link svg {
            width: 22px;
            height: 22px;
            opacity: 0.7;
        }

        .sb-link.active {
            color: var(--acc);
            border-left-color: var(--acc);
            background: var(--acc-bg);
        }

        .sb-link.active svg {
            opacity: 1;
        }

        .sb-theme-btn {
            margin: 20px;
            padding: 12px;
            border-radius: 12px;
            background: var(--bg3);
            border: 1px solid var(--border);
            color: var(--t1);
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }
    </style>
</head>

<body>
    <script>
        if (localStorage.getItem('theme') === 'light' || document.documentElement.classList.contains('light-mode')) {
            document.body.classList.add('light-mode');
            document.documentElement.classList.add('light-mode');
        }
    </script>


    <div class="app-container">

        <div class="header-top">
            <button class="back-btn" onclick="window.location.href='home_admin.html'">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
            </button>
            <div style="font-size: 18px; font-weight: 800; color: var(--t1);">Radar da Frota</div>
    
        </div>

        <div class="map-wrapper">
            <div id="mapa-frota-central"></div>
        </div>

        <div class="frota-list-wrapper">
            <div class="sec-lbl">
                <span>Motoristas Conectados</span>
                <span
                    style="font-size: 10px; font-weight: 600; color: var(--acc); background: var(--acc-bg); padding: 4px 10px; border-radius: 10px;"
                    id="contador-frota">0 Online</span>
            </div>

            <div id="lista-frota-central">
                <div style="text-align: center; padding: 20px; color: var(--t3); font-size: 12px;">Buscando radar...
                </div>
            </div>
        </div>

    </div>

    <script src="../static/app.js"></script>
    <script>
        const token = localStorage.getItem("token") || sessionStorage.getItem("token");
        if (!token) window.location.href = "../Usuario/login.html";

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open');
        }

        // ==========================================
        // 1. INICIALIZA O MAPA
        // ==========================================
        const centroPadrao = [-6.0673, -49.9036];
        var map = L.map('mapa-frota-central', { zoomControl: false }).setView(centroPadrao, 14);

        const tileUrl = 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png';

        L.tileLayer(tileUrl, { attribution: '© OpenStreetMap' }).addTo(map);

        // ==========================================
        // 2. ÍCONES E MÁGICA DE TEMPO REAL
        // ==========================================
        let marcadoresMotoristas = {};

        function criarIconeCarro(nome, statusSafe) {
            let corShadow = "rgba(255,255,255,0.5)"; // Cinza/Offline
            if (statusSafe === "disponivel") corShadow = "#2ecc71"; // Verde
            else if (statusSafe === "em corrida" || statusSafe === "ocupado") corShadow = "#f39c12"; // Laranja

            return L.divIcon({
                className: '',
                html: `
                    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;">
                        <div style="background: rgba(0,0,0,0.85); color: #fff; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 8px; white-space: nowrap; margin-bottom: 2px; border: 1px solid rgba(255,255,255,0.2); font-family: 'Sora', sans-serif;">
                            ${nome}
                        </div>
                        <div style="font-size: 28px; line-height: 1; filter: drop-shadow(0px 0px 6px ${corShadow});">
                            🚗
                        </div>
                    </div>
                `,
                iconSize: [60, 50],
                iconAnchor: [30, 45],
                popupAnchor: [0, -45]
            });
        }

        async function atualizarMapaTempoReal() {
            try {
                const response = await fetch(`${window.API_URL}/api/admin/motoristas/localizacao`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Erro na rede');

                const motoristas = await response.json();
                if (!Array.isArray(motoristas)) return;

                renderizarListaFrota(motoristas);

                const idsAtivosMap = [];

                motoristas.forEach(mot => {
                    const id = mot.motorista_id || mot.MotoristaID || mot.id || mot.ID;

                    // 1. Lê o nome garantido injetado pelo back-end novo!
                    const nome = mot.nome_garantido || mot.nome || `Mot. #${id}`;

                    const lat = mot.latitude || mot.Latitude;
                    const lng = mot.longitude || mot.Longitude;

                    const statusOriginal = mot.status || mot.Status || 'Offline';
                    const statusSafe = statusOriginal.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();

                    // 2. REGRA DO MAPA: Identifica Offline, Inativo e INDISPONÍVEL
                    const ocultarNoMapa = (statusSafe === "offline" || statusSafe === "inativo" || statusSafe === "indisponivel");

                    // 3. Só desenha no mapa se a coordenada for válida e NÃO estiver oculto
                    if (lat !== 0 && lng !== 0 && !ocultarNoMapa) {
                        idsAtivosMap.push(String(id));
                        const iconeDinamico = criarIconeCarro(nome, statusSafe);

                        if (marcadoresMotoristas[id]) {
                            marcadoresMotoristas[id].setLatLng([lat, lng]);
                            marcadoresMotoristas[id].setIcon(iconeDinamico);
                        } else {
                            marcadoresMotoristas[id] = L.marker([lat, lng], { icon: iconeDinamico }).addTo(map);
                        }
                    }
                });

                // LIMPEZA: Remove quem ficou offline ou indisponível
                Object.keys(marcadoresMotoristas).forEach(idMarcador => {
                    if (!idsAtivosMap.includes(idMarcador)) {
                        map.removeLayer(marcadoresMotoristas[idMarcador]);
                        delete marcadoresMotoristas[idMarcador];
                    }
                });

            } catch (error) {
                console.error("Erro ao buscar localizações:", error);
            }
        }

        // ==========================================
        // RENDERIZAR A LISTA VIVA
        // ==========================================
        function renderizarListaFrota(motoristas) {
            const container = document.getElementById('lista-frota-central');
            const contador = document.getElementById('contador-frota');

            if (!motoristas || motoristas.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 20px; color: var(--t3); font-size: 12px;">Nenhum motorista no radar.</div>';
                contador.innerText = "0 Motoristas";
                return;
            }

            contador.innerText = `${motoristas.length} Registros`;

            // Ordena
            const motOrdenados = [...motoristas].sort((a, b) => {
                const sa = (a.status || a.Status || "").toLowerCase();
                const sb = (b.status || b.Status || "").toLowerCase();
                if (sa.includes("disponivel")) return -1;
                if (sb.includes("disponivel")) return 1;
                if (sa.includes("corrida")) return -1;
                if (sb.includes("corrida")) return 1;
                return 0;
            });

            let html = "";
            motOrdenados.forEach(m => {
                const id = m.motorista_id || m.MotoristaID || m.id || m.ID;

                // Lendo o nome garantido
                const nome = m.nome_garantido || m.nome || `Mot. #${id}`;

                const statusOriginal = m.status || m.Status || "Offline";
                const statusSafe = statusOriginal.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();

                let corBorda = "#94a3b8";
                let iconeStatus = "⚪";

                if (statusSafe === "disponivel") { corBorda = "#2ecc71"; iconeStatus = "🟢"; }
                else if (statusSafe === "em corrida" || statusSafe === "ocupado") { corBorda = "#f39c12"; iconeStatus = "🟠"; }
                else if (statusSafe === "indisponivel") { corBorda = "#95a5a6"; iconeStatus = "🟡"; }
                else { corBorda = "#e74c3c"; iconeStatus = "🔴"; } // Offline

                const lat = m.latitude || m.Latitude;
                const lng = m.longitude || m.Longitude;

                // Também ocultamos o botão "Ver Mapa" se ele não vai aparecer no mapa
                const ocultarNoMapa = (statusSafe === "offline" || statusSafe === "inativo" || statusSafe === "indisponivel");

                const btnMapa = (lat !== 0 && lng !== 0 && !ocultarNoMapa)
                    ? `<button class="btn-focar" onclick="focarNoMapa(${lat}, ${lng})">📍 Ver Mapa</button>`
                    : `<span style="font-size:10px; color:var(--t3); font-weight:700;">Localização Oculta</span>`;

                html += `
                <div class="driver-card" style="border-left: 4px solid ${corBorda};">
                    <div style="display:flex; align-items:center; gap: 12px;">
                        <div style="width:40px;height:40px;background:var(--bg3);border-radius:12px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;">
                            🚗
                        </div>
                        <div>
                            <div style="font-size:13.5px;font-weight:800;color:var(--t1); margin-bottom: 3px;">${nome}</div>
                            <div style="font-size:10px;color:var(--t2);font-weight:700;">${iconeStatus} ${statusOriginal}</div>
                        </div>
                    </div>
                    ${btnMapa}
                </div>
                `;
            });

            container.innerHTML = html;
        }

        function focarNoMapa(lat, lng) {
            if (lat && lng && map) {
                map.flyTo([lat, lng], 16, { animate: true, duration: 1.5 });
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // START
        atualizarMapaTempoReal();
        setInterval(atualizarMapaTempoReal, 5000);

        function fazerLogout(avisarApi = true) {
            if (avisarApi) {
                fetch(`${window.API_URL}/api/logout`, { method: "POST" }).catch(e => console.log(e));
            }
            localStorage.removeItem("token");
            sessionStorage.removeItem("token");
            window.location.href = "../Usuario/login.html";
        }
    </script>
</body>

</html>

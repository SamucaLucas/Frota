<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Sousa Locações e Transportes</title>
    <link rel="icon" href="../static/img/Logo-icon.png" type="image/png">
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../static/style.css">

    <style>
        /* CSS adicional para o Checkbox customizado funcionar visualmente */
        .custom-checkbox input:checked+.custom-box span {
            display: block !important;
        }
    </style>
</head>

<body>

    <div class="app-container">

        <button id="theme-toggle" class="theme-btn">☀️ Claro</button>

        <div style="display:flex; flex-direction:column; flex:1">

            <div class="hero" style="padding-bottom:10px">
                <div class="hero-accent"></div>
                <div style="margin-top:2px">
                    <div class="brand-container"
                        style="max-width: 100%; display: flex; align-items:start; justify-content: start; margin-bottom: 2px;">
                        <img src="../static/img/Logo-branco.png" alt="Sousa Transportes" class="sousa-logo logo-dark"
                            style="width: auto; height: auto">
                        <img src="../static/img/Logo.png" alt="Sousa Transportes" class="sousa-logo logo-white"
                            style="width: auto; height: auto">
                    </div>
                    <div class="hero-decorative-line"></div>
                    <div class="hero-subtitle">Bem-vindo de volta</div>
                    <div class="hero-title">Faça login para<br>continuar</div>
                </div>
            </div>

            <form id="formLogin" style="flex:1; padding:22px 18px; background: var(--bg2);">

                <div id="mensagem-erro" class="toast-msg toast-error" style="display: none;"></div>
                <div id="mensagem-sucesso" class="toast-msg toast-success" style="display: none;"></div>

                <div class="inp-wrap">
                    <span class="inp-icon">✉️</span>
                    <div style="flex:1">
                        <div class="inp-lbl">E-mail</div>
                        <input class="inp" type="email" id="email" name="email" required placeholder="joao@email.com"
                            autocapitalize="none">
                    </div>
                </div>

                <div class="inp-wrap">
                    <span class="inp-icon">🔒</span>
                    <div style="flex:1">
                        <div class="inp-lbl">Senha</div>
                        <input class="inp" type="password" name="senha" id="inputSenha" required placeholder="••••••••">
                    </div>
                    <span id="btnMostrarSenha" style="display:flex; align-items:center; justify-content:center; width: 24px; height: 24px; opacity:.5; cursor:pointer; padding-left: 8px; transition: all 0.3s ease;" onclick="toggleSenha()">
                        <!-- SVG Olho Fechado (Padrão) -->
                        <svg id="iconeOlho" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </span>
                </div>

                <div class="row" style="margin-bottom:20px; margin-top:10px;">
                    <label class="custom-checkbox"
                        style="display:flex; align-items:center; gap:7px; font-size:12px; color:var(--t2); cursor:pointer">
                        <input type="checkbox" name="lembrar" style="display:none;">
                        <div class="custom-box"
                            style="width:16px; height:16px; border-radius:4px; background:var(--bg3); border:1px solid var(--border); display:flex; align-items:center; justify-content:center;">
                            <span style="color:var(--acc); font-size:10px; font-weight:900; display:none;">✓</span>
                        </div>
                        Manter conectado
                    </label>

                    <span style="font-size:12px; color:var(--t3); cursor:pointer"
                        onclick="window.location.href='../Em dev/contrucao.html'">Esqueci minha senha</span>
                </div>

                <button type="submit" class="btn" id="btnAcesso" style="width: 100%;">Entrar no Sistema →</button>

                <div style="text-align:center; margin-bottom:14px; margin-top:14px;">
                    <span style="font-size:11px; color:var(--t4); letter-spacing:.3px">OU</span>
                </div>

                <div style="display:flex; gap:8px; margin-bottom:10px">
                    <button type="button" class="btn-ghost" onclick="fazerLoginGoogle()" style="width: 100%;">
                        <span style="font-size:14px; font-weight:800; color:var(--t1)">G</span> Continuar com Google
                    </button>
                </div>

                <div style="text-align:center; margin-top:16px; font-size:12px; color:var(--t3)">Novo por aqui?
                    <a href="cadastro.html" style="color:var(--acc); font-weight:700; text-decoration:none;">Criar
                        conta</a>
                </div>

                <div
                    style="text-align:center; margin-top:12px; display:flex; align-items:center; justify-content:center; gap:6px">
                    <span style="font-size:14px">🔐</span>
                    <div>
                        <div style="font-size:10px; font-weight:700; color:var(--t2)">Seus dados estão protegidos</div>
                        <div style="font-size:9px; color:var(--t4)">Criptografia de ponta a ponta</div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div id="pwa-banner" class="pwa-banner">
        <div class="pwa-header">
            <div style="display:flex; align-items:center; gap:10px;">
                <img src="../static/img/Logo.png" class="logo-dark" style="height:24px; width:auto;">
                <img src="../static/img/Logo-branco.png" class="logo-white" style="height:24px; width:auto;">
                <div>
                    <div style="font-size:12px; font-weight:700; color:var(--t1)">Instalar App Sousa</div>
                    <div style="font-size:9px; color:var(--t3)">Acesso rápido e sem navegador</div>
                </div>
            </div>
            <button class="pwa-close" onclick="fecharBannerPWA()">×</button>
        </div>
        <button id="btn-instalar-android" class="btn"
            style="display:none; padding:10px; font-size:12px; width: 100%;">Instalar Agora ↓</button>

        <div id="instrucao-ios" class="ios-instructions" style="display:none;">
            <span>1. Toque em <b>Compartilhar</b> <svg
                    style="width:14px;height:14px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2"
                    viewBox="0 0 24 24">
                    <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M12 3v14M8 7l4-4 4 4" />
                </svg> <br>2. Escolha <b>Adicionar à Tela de Início</b> <svg
                    style="width:14px;height:14px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2"
                    viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                    <line x1="12" y1="8" x2="12" y2="16" />
                    <line x1="8" y1="12" x2="16" y2="12" />
                </svg></span>
        </div>
    </div>

    <script src="../static/app.js"></script>

    <script>
        // ==========================================
        // AUTO-LOGIN (A MÁGICA QUE FALTAVA)
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            const tokenExistente = localStorage.getItem("token") || sessionStorage.getItem("token");

            // Se já tiver um token salvo (permanente ou temporário), tenta pular o login!
            if (tokenExistente) {
                const btnSubmit = document.getElementById('btnAcesso');
                btnSubmit.innerHTML = 'Restaurando sessão...';
                btnSubmit.disabled = true;

                fetch(`${window.API_URL}/api/verificar-token`, {
                    method: "GET",
                    headers: { "Authorization": `Bearer ${tokenExistente}` }
                })
                    .then(res => res.json())
                    .then(dados => {
                        if (dados.sucesso || dados.valido) {
                            // Sessão válida! Redireciona pra home dele.
                            if (dados.papel === "admin") window.location.href = "../Admin/home_admin.html";
                            else if (dados.papel === "motorista") window.location.href = "../Motorista/home_motorista.html";
                            else window.location.href = "../Passageiro/home_Passageiro.html";
                        } else {
                            // Token expirado ou conta bloqueada (Limpa tudo para forçar o usuário a digitar senha denovo)
                            localStorage.removeItem("token");
                            sessionStorage.removeItem("token");
                            btnSubmit.innerHTML = 'Entrar no Sistema →';
                            btnSubmit.disabled = false;
                        }
                    })
                    .catch(err => {
                        console.error("Erro ao validar sessão silenciosa", err);
                        btnSubmit.innerHTML = 'Entrar no Sistema →';
                        btnSubmit.disabled = false;
                    });
            }
        });

        // ==========================================
        // LÓGICA DE SENHA E CHECKBOX
        // ==========================================
        function toggleSenha() {
            const input = document.getElementById("inputSenha");
            const btn = document.getElementById("btnMostrarSenha");
            const icone = document.getElementById("iconeOlho");

            // Animação de clique (dá um pulinho)
            btn.style.transform = "scale(0.8)";
            setTimeout(() => btn.style.transform = "scale(1)", 150);

            if (input.type === "password") {
                input.type = "text";
                btn.style.opacity = "1";
                btn.style.color = "var(--acc)";
                // Troca pro SVG de Olho Aberto
                icone.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            } else {
                input.type = "password";
                btn.style.opacity = "0.5";
                btn.style.color = "";
                // Troca pro SVG de Olho Fechado
                icone.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            }
        }

        // ==========================================
        // MÁGICA DA API REST (LOGIN NORMAL)
        // ==========================================
        document.getElementById('formLogin').addEventListener('submit', function (event) {
            event.preventDefault();

            const emailInput = document.getElementById('email').value;
            const senhaInput = document.getElementById('inputSenha').value;
            const msgErro = document.getElementById('mensagem-erro');
            const btnSubmit = document.getElementById('btnAcesso');

            msgErro.style.display = 'none';
            btnSubmit.innerHTML = 'Entrando...';
            btnSubmit.disabled = true;

            fetch(`${window.API_URL}/api/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: emailInput, senha: senhaInput })
            })
                .then(res => res.json())
                .then(dados => {
                    if (dados.sucesso || dados.valido) {

                        // A LÓGICA DO CHECKBOX FICA AQUI (Após o sucesso!)
                        const lembrar = document.querySelector('input[name="lembrar"]').checked;
                        if (lembrar) {
                            localStorage.setItem("token", dados.token); // Salva permanente (Auto-login vai ler isso)
                        } else {
                            sessionStorage.setItem("token", dados.token); // Salva temporário (Apaga se fechar guia)
                        }

                        // Redireciona conforme o papel
                        if (dados.papel === "admin") {
                            window.location.href = "../Admin/home_admin.html";
                        } else if (dados.papel === "motorista") {
                            window.location.href = "../Motorista/home_motorista.html";
                        } else {
                            window.location.href = "../Passageiro/home_Passageiro.html";
                        }
                    } else {
                        msgErro.textContent = dados.erro || "Erro de login";
                        msgErro.style.display = 'block';
                        btnSubmit.innerHTML = 'Entrar no Sistema →';
                        btnSubmit.disabled = false;
                    }
                })
                .catch(error => {
                    console.error('Erro na requisição:', error);
                    msgErro.textContent = 'Erro ao conectar com o servidor. Verifique sua conexão.';
                    msgErro.style.display = 'block';
                    btnSubmit.innerHTML = 'Entrar no Sistema →';
                    btnSubmit.disabled = false;
                });
        });

        // ==========================================
        // MÁGICA DA API REST (LOGIN GOOGLE HÍBRIDO)
        // ==========================================
        async function fazerLoginGoogle() {
            // Pega o valor do checkbox de lembrar conexao antes de iniciar o fluxo
            const lembrar = document.querySelector('input[name="lembrar"]').checked;

            if (window.Capacitor && window.Capacitor.isNativePlatform()) {
                // FLUXO NATIVO DO APLICATIVO
                try {
                    // Puxa o plugin GoogleAuth correto do Capacitor
                    const GoogleAuth = window.Capacitor.Plugins.GoogleAuth;

                    // Em alguns casos é necessário inicializar antes
                    await GoogleAuth.initialize();

                    const googleUser = await GoogleAuth.signIn();

                    const response = await fetch(`${window.API_URL}/api/google/login`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            email: googleUser.email,
                            nome: googleUser.displayName || googleUser.name
                        })
                    });

                    const dados = await response.json();

                    if (dados.precisa_completar) {
                        // Limpamos o localStorage temporario se o user nao concluiu antes
                        localStorage.removeItem("email_temp_google");
                        localStorage.removeItem("nome_temp_google");

                        localStorage.setItem("email_temp_google", dados.email);
                        localStorage.setItem("nome_temp_google", dados.nome);
                        // Guarda a preferência de "lembrar" para a proxima tela
                        localStorage.setItem("lembrar_google_temp", lembrar ? "true" : "false");

                        window.location.href = "completar_cadastro.html";
                    } else if (dados.sucesso || dados.valido) {
                        // A LÓGICA DO CHECKBOX PARA O NATIVO AQUI
                        if (lembrar) {
                            localStorage.setItem("token", dados.token);
                        } else {
                            sessionStorage.setItem("token", dados.token);
                        }

                        if (dados.papel === "admin") window.location.href = "../Admin/home_admin.html";
                        else if (dados.papel === "motorista") window.location.href = "../Motorista/home_motorista.html";
                        else window.location.href = "../Passageiro/home_Passageiro.html";
                    }
                } catch (error) {
                    console.error("Erro no login Google Nativo:", error);
                    alert("Falha ao abrir login do Google no aplicativo: " + JSON.stringify(error));
                }
            } else {
                // FLUXO WEB NAVEGADOR
                // Salva um "aviso" no navegador pra ele lembrar da escolha quando voltar da página do Google
                if (lembrar) {
                    localStorage.setItem("forcar_lembrar_google_web", "true");
                } else {
                    localStorage.removeItem("forcar_lembrar_google_web");
                }
                window.location.href = `${window.API_URL}/auth/google/login`;
            }
        }

        // Registra o PWA apenas se estiver no Navegador (Web) usando HTTPS
        if ('serviceWorker' in navigator && (!window.Capacitor || !window.Capacitor.isNativePlatform())) {
            navigator.serviceWorker.register('../sw.js')
                .then(() => console.log('[PWA] Service Worker Registrado com Sucesso!'))
                .catch(err => console.log('[PWA] Falha ao registrar Service Worker:', err));
        }
    </script>
</body>

</html>
